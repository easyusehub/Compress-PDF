<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Compress PDF – EasyUseHub</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Hybrid PDF compressor. Small files compressed in-browser, large files via API, with progress and size preview.">
<script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
<style>
body{font-family:Arial,sans-serif;background:#f5f7fa;margin:0;padding:0;text-align:center;}
header{background:#fff;padding:20px;box-shadow:0 2px 5px rgba(0,0,0,.1);}
header img{max-height:60px;}
.button-group{display:flex;justify-content:center;gap:15px;margin:15px 0;flex-wrap:wrap;}
.button-group a{text-decoration:none;}
.button-group button{padding:12px 20px;border:none;border-radius:10px;font-weight:600;cursor:pointer;transition:0.3s;color:#fff;}
.button-group button:hover{transform:scale(1.05);}
.all-tools-btn{background:linear-gradient(135deg,#9333ea,#7c3aed);}
.home-btn{background:linear-gradient(135deg,#f97316,#f59e0b);}
main{max-width:700px;margin:20px auto;background:#fff;padding:30px;border-radius:10px;box-shadow:0 4px 10px rgba(0,0,0,.08);}
input[type=file]{margin:20px 0;}
button.tool-btn{padding:12px 20px;border:none;border-radius:10px;background:linear-gradient(135deg,#9333ea,#7c3aed);color:#fff;font-weight:600;cursor:pointer;transition:0.3s;}
button.tool-btn:hover{transform:scale(1.05);}
#msg{margin-top:15px;font-weight:bold;}
#progress-container{width:100%;background:#e0e0e0;height:20px;border-radius:10px;margin-top:20px;display:none;}
#progress-bar{width:0%;height:100%;background:#2563eb;border-radius:10px;}
#size-info{margin-top:10px;font-weight:600;}
</style>
</head>
<body>

<header>
<img src="https://i.ibb.co.com/dJzLMz0v/file-0000000031a471f89cb536e7c16bcf16.png" alt="EasyUseHub Logo">
</header>

<div class="button-group">
<a href="https://easyusehub.blogspot.com/p/free-pdf-tools-easyusehub.html?m=1">
<button class="all-tools-btn">All PDF Tools</button>
</a>
<a href="https://easyusehub.blogspot.com/?m=1">
<button class="home-btn">Home</button>
</a>
</div>

<main>
<h1>Compress PDF</h1>
<p>Small PDFs are compressed in-browser safely. Large PDFs use API backend for maximum compression.</p>

<input type="file" id="pdfFile" accept="application/pdf"><br>
<button class="tool-btn" onclick="compressPDF()">Compress PDF</button>

<div id="msg"></div>
<div id="progress-container"><div id="progress-bar"></div></div>
<div id="size-info"></div>
</main>

<script>
async function compressPDF(){
  const fileInput=document.getElementById("pdfFile");
  const msg=document.getElementById("msg");
  const progressContainer=document.getElementById("progress-container");
  const progressBar=document.getElementById("progress-bar");
  const sizeInfo=document.getElementById("size-info");

  msg.innerText=''; sizeInfo.innerText=''; progressBar.style.width='0%'; progressContainer.style.display='none';

  if(!fileInput.files.length){ msg.innerText="Please select a PDF file."; return; }
  const file=fileInput.files[0];

  const updateProgress=(percent)=>{ progressBar.style.width=percent+'%'; progressContainer.style.display='block'; }

  // If file is small (<3 MB), try browser compression
  if(file.size <= 3*1024*1024){
    msg.innerText="Compressing in browser...";
    try{
      const bytes=await file.arrayBuffer();
      const pdfDoc=await PDFLib.PDFDocument.load(bytes);
      const newPdf=await PDFLib.PDFDocument.create();
      const pages=pdfDoc.getPages();
      for(const [index,page] of pages.entries()){
        const copied=await newPdf.copyPages(pdfDoc,[index]);
        copied.forEach(p=>newPdf.addPage(p));
        updateProgress(Math.floor((index+1)/pages.length*50)); // progress 0-50%
      }
      const compressedBytes=await newPdf.save({useObjectStreams:false});
      // If browser compression increases size, fallback to API
      if(compressedBytes.byteLength >= file.size){
        msg.innerText="Browser compression minimal, sending to server...";
        await apiCompress(file);
      } else {
        const blob=new Blob([compressedBytes],{type:"application/pdf"});
        const url=URL.createObjectURL(blob);
        const a=document.createElement("a"); a.href=url; a.download="compressed.pdf"; a.click();
        updateProgress(100);
        msg.innerText="✅ Browser compression done!";
        sizeInfo.innerText=`Original: ${(file.size/1024/1024).toFixed(2)} MB | Compressed: ${(blob.size/1024/1024).toFixed(2)} MB`;
      }
    }catch(err){console.error(err); msg.innerText="❌ Browser compression failed.";}
  } else {
    await apiCompress(file);
  }

  async function apiCompress(file){
    try{
      const arrayBuffer=await file.arrayBuffer();
      const base64File=btoa(String.fromCharCode(...new Uint8Array(arrayBuffer)));
      updateProgress(20);
      const response=await fetch("/api/compress",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({file:base64File})
      });
      updateProgress(60);
      const data=await response.json();
      if(response.ok){
        const binary=atob(data.file);
        const len=binary.length;
        const bytes=new Uint8Array(len);
        for(let i=0;i<len;i++) bytes[i]=binary.charCodeAt(i);
        const blob=new Blob([bytes],{type:"application/pdf"});
        const url=URL.createObjectURL(blob);
        const a=document.createElement("a"); a.href=url; a.download="compressed.pdf"; a.click();
        updateProgress(100);
        msg.innerText="✅ API compression done!";
        sizeInfo.innerText=`Original: ${(file.size/1024/1024).toFixed(2)} MB | Compressed: ${(blob.size/1024/1024).toFixed(2)} MB`;
      } else { msg.innerText=`❌ API Error: ${data.error||"Unknown"}`; }
    }catch(err){console.error(err); msg.innerText="❌ Upload failed.";}
  }
}
</script>

</body>
</html>
