<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Compress PDF – EasyUseHub</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{font-family:Arial,sans-serif;background:#f5f7fa;text-align:center;margin:0;padding:0;}
main{max-width:700px;margin:40px auto;background:#fff;padding:30px;border-radius:8px;box-shadow:0 4px 10px rgba(0,0,0,.08);}
input[type=file]{margin:20px 0;}
button{padding:12px 20px;background:#2563eb;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:16px;}
button:hover{background:#1e40af;}
#msg{margin-top:20px;font-weight:bold;}
</style>
</head>
<body>
<main>
<h1>Compress PDF</h1>
<input type="file" id="pdfFile" accept="application/pdf"><br>
<button onclick="compressPDF()">Compress PDF</button>
<div id="msg"></div>
</main>

<script>
async function compressPDF(){
  const fileInput=document.getElementById("pdfFile");
  const msg=document.getElementById("msg");

  if(!fileInput.files.length){ msg.innerText="Please select a PDF."; return; }
  const file=fileInput.files[0];
  msg.innerText="Processing...";

  const MAX_SERVER_SIZE=4.5*1024*1024; // 4.5 MB

  if(file.size <= MAX_SERVER_SIZE){
    try {
      const formData=new FormData();
      formData.append("file",file);
      const res=await fetch("/api/compress",{method:"POST",body:formData});
      if(!res.ok){ msg.innerText=`❌ Server failed: ${await res.text()}`; return; }
      const blob=await res.blob();
      const url=URL.createObjectURL(blob);
      const a=document.createElement("a");
      a.href=url; a.download="compressed.pdf";
      a.click();
      msg.innerText="✅ Compression done via server!";
    } catch(e){ console.error(e); msg.innerText="❌ Server upload failed."; }
  } else {
    try {
      msg.innerText="Large file detected. Uploading directly to iLovePDF...";
      const formData=new FormData();
      formData.append("file",file);

      const res=await fetch("https://api.ilovepdf.com/v1/compress",{method:"POST", headers:{Authorization:`Bearer project_public_d522aaeb3532`}, body:formData});
      if(!res.ok){ msg.innerText=`❌ iLovePDF failed: ${await res.text()}`; return; }

      const result=await res.json();
      const downloadResp=await fetch(result.output_file.url);
      const blob=await downloadResp.blob();
      const url=URL.createObjectURL(blob);
      const a=document.createElement("a");
      a.href=url; a.download="compressed.pdf";
      a.click();
      msg.innerText="✅ Compression done via iLovePDF!";
    } catch(e){ console.error(e); msg.innerText="❌ Direct API upload failed."; }
  }
}
</script>
</body>
</html>
