<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Compress PDF – EasyUseHub</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <img src="https://i.ibb.co.com/dJzLMz0v/file-0000000031a471f89cb536e7c16bcf16.png" alt="EasyUseHub Logo" style="height:60px;">
</header>

<main>
  <h1>Compress PDF</h1>
  
  <input type="file" id="pdfFile" accept="application/pdf"><br>
  <button onclick="compressPDF()">Compress PDF</button>
  
  <div id="progress-container" style="width:100%; max-width:400px; margin:20px auto; display:none;">
    <div id="progress-bar" style="width:0%; height:20px; background:#2563eb; border-radius:5px;"></div>
  </div>
  
  <div id="msg" style="margin-top:20px; font-weight:bold;"></div>
  
  <!-- Buttons for all PDF tools -->
  <div style="margin-top:30px;">
    <button onclick="location.href='repair.html'">Repair PDF</button>
    <button onclick="location.href='compare.html'">Compare PDF</button>
    <button onclick="location.href='html2pdf.html'">HTML → PDF</button>
    <button onclick="location.href='index.html'">Home</button>
  </div>
  
  <!-- Ad placeholder -->
  <div style="margin-top:40px; padding:20px; background:#f0f0f0; text-align:center; color:#777;">
    Ad space
  </div>
</main>

<script>
const ILOVEPDF_PUBLIC_KEY = 'project_public_01be3ee3fe2e1e9f38eb5010469a1a48_L2eVu78694d19a2f8d38e5446ac2d25fdc215'; // Your iLovePDF public key

async function compressPDF() {
  const fileInput = document.getElementById("pdfFile");
  const msg = document.getElementById("msg");
  const progressContainer = document.getElementById("progress-container");
  const progressBar = document.getElementById("progress-bar");

  if (!fileInput.files.length) { msg.innerText = "Please select a PDF."; return; }
  const file = fileInput.files[0];
  msg.innerText = "Uploading and compressing...";

  progressContainer.style.display = 'block';
  progressBar.style.width = '0%';

  try {
    const formData = new FormData();
    formData.append("file", file);

    const xhr = new XMLHttpRequest();
    xhr.open("POST", "https://api.ilovepdf.com/v1/compress", true);
    xhr.setRequestHeader("Authorization", `Bearer ${PUBLIC_KEY}`);

    xhr.upload.onprogress = function(e) {
      if (e.lengthComputable) {
        const percent = Math.round((e.loaded / e.total) * 100);
        progressBar.style.width = percent + '%';
      }
    };

    xhr.onload = async function() {
      if (xhr.status !== 200) {
        msg.innerText = `❌ Compression failed: ${xhr.statusText}`;
        progressBar.style.width = '0%';
        return;
      }

      const result = JSON.parse(xhr.responseText);
      if (!result.output_file || !result.output_file.url) {
        msg.innerText = "❌ Compression failed: No file returned";
        return;
      }

      // Download compressed file
      const downloadResp = await fetch(result.output_file.url);
      const blob = await downloadResp.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "compressed.pdf";
      a.click();

      msg.innerText = "✅ Compression completed!";
      progressBar.style.width = '100%';
    };

    xhr.send(formData);

  } catch (e) {
    console.error(e);
    msg.innerText = "❌ Compression failed.";
  }
}
</script>

</body>
</html>
