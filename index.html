<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Compress PDF Online – EasyUseHub</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Compress PDF files online. Files up to 15MB are compressed directly in your browser. Large files supported via API.">
<script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
<style>
body { font-family: Arial, sans-serif; background:#f5f7fa; margin:0; padding:0; text-align:center;}
header { background:#fff; padding:15px; text-align:center; box-shadow:0 2px 5px rgba(0,0,0,.1);}
header img { max-height:55px; }
main { max-width:700px; margin:40px auto; background:#fff; padding:30px; border-radius:8px; box-shadow:0 4px 10px rgba(0,0,0,.08);}
h1 { margin-top:0; }
input[type=file] { margin:20px 0; }
button { padding:12px 20px; background:#2563eb; color:#fff; border:none; border-radius:6px; cursor:pointer; font-size:16px; }
button:hover { background:#1e40af; }
#msg { margin-top:20px; font-weight:bold; }
.ad { margin-top:40px; padding:20px; background:#f0f0f0; text-align:center; color:#777; }
footer { margin-top:30px; text-align:center; }
footer a { text-decoration:none; color:#2563eb; }
</style>
</head>
<body>

<header>
<img src="https://i.ibb.co.com/dJzLMz0v/file-0000000031a471f89cb536e7c16bcf16.png" alt="EasyUseHub Logo">
</header>

<main>
<h1>Compress PDF</h1>
<p>Compress PDF files securely. Up to <strong>15 MB</strong> works in browser. Larger files use API.</p>

<input type="file" id="pdfFile" accept="application/pdf"><br>
<button onclick="compressPDF()">Compress PDF</button>

<div id="msg"></div>
<div class="ad">Ad space</div>
</main>

<footer>
<p><a href="https://easyusehub.blogspot.com/p/free-pdf-tools-easyusehub.html?m=1">Home</a></p>
<p>© EasyUseHub</p>
</footer>

<script>
async function compressPDF() {
  const fileInput = document.getElementById("pdfFile");
  const msg = document.getElementById("msg");

  if (!fileInput.files.length) {
    msg.innerText = "Please select a PDF file.";
    return;
  }

  const file = fileInput.files[0];

  // Browser compression for small files
  if (file.size <= 15 * 1024 * 1024) {
    msg.innerText = "Compressing in browser...";
    try {
      const bytes = await file.arrayBuffer();
      const pdfDoc = await PDFLib.PDFDocument.load(bytes);
      const newPdf = await PDFLib.PDFDocument.create();
      const pages = await newPdf.copyPages(pdfDoc, pdfDoc.getPageIndices());
      pages.forEach(p => newPdf.addPage(p));

      const compressedBytes = await newPdf.save({ useObjectStreams: false });
      const blob = new Blob([compressedBytes], { type: "application/pdf" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "compressed.pdf";
      a.click();

      msg.innerText = `✅ Browser compression done! Original: ${(file.size/1024/1024).toFixed(2)} MB | Compressed: ${(blob.size/1024/1024).toFixed(2)} MB`;

    } catch(err){
      console.error(err);
      msg.innerText = "❌ Browser compression failed. Sending to server...";
      await apiCompress(file);
    }
  } else {
    // Use API for large files
    await apiCompress(file);
  }

  async function apiCompress(file){
    try {
      const arrayBuffer = await file.arrayBuffer();
      const base64File = btoa(String.fromCharCode(...new Uint8Array(arrayBuffer)));

      msg.innerText = "Uploading to server...";
      const res = await fetch("/api/compress", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ file: base64File })
      });

      const data = await res.json();
      if (!res.ok) {
        msg.innerText = data.error ? (typeof data.error === 'string' ? data.error : JSON.stringify(data.error)) : "Upload failed.";
        return;
      }

      const binary = atob(data.file);
      const bytes = new Uint8Array(binary.length);
      for(let i=0; i<binary.length; i++) bytes[i] = binary.charCodeAt(i);
      const blob = new Blob([bytes], { type: "application/pdf" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "compressed.pdf";
      a.click();

      msg.innerText = `✅ API compression done! Original: ${(file.size/1024/1024).toFixed(2)} MB | Compressed: ${(blob.size/1024/1024).toFixed(2)} MB`;

    } catch(err){
      console.error(err);
      msg.innerText = "❌ Upload failed.";
    }
  }
}
</script>

</body>
</html>
